# Runs on every pull request and on pushes to main: lint, formatting, unit tests,
# the check that sw.js lists every file needed offline, and a test build of the site.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: the workflow never needs to write to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A time zone with daylight saving, so the date tests cover DST changes.
      TZ: Europe/Warsaw
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); the comment shows the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: python3 scripts/check_precache.py
      - run: npm run build
