<!doctype html>
<!--
  Travel Year — markup only. Styles live in src/styles/, behaviour in src/ (entry: src/main.js).
  Text is filled in from src/i18n.js via data-i18n / data-i18n-aria / data-i18n-ph attributes.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Year</title>
<meta name="description" content="Wygeneruj swój travel year – kalendarz całego roku, w którym dni podróży zastępują flagi odwiedzonych krajów.">

<!-- Icons, installable app (PWA). Icon sources: src/assets/icons/icon.svg → scripts/make-assets.html -->
<link rel="icon" href="src/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="src/assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="src/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">

<!--
  Link previews (Open Graph / X). Most apps need an ABSOLUTE og:image URL:
  once the domain is known, replace "src/assets/og-image.png" with "https://<domain>/src/assets/og-image.png"
  and add <meta property="og:url" content="https://<domain>/">.
-->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Travel Year">
<meta property="og:title" content="Travel Year – Twój rok w podróżach">
<meta property="og:description" content="Zaznacz swoje podróże, a dni w kalendarzu zamienią się we flagi odwiedzonych krajów. Zapisz obrazek i pochwal się swoim rokiem.">
<meta property="og:image" content="src/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Kalendarz roku 2026, w którym dni podróży są oznaczone flagami krajów">
<meta property="og:locale" content="pl_PL">
<meta property="og:locale:alternate" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<!--
  Content Security Policy: the page may load scripts, styles, fonts and images from its own
  origin only (data: is allowed for the small inline SVG icon in the search box).
  Everything is self-hosted, so any new external service must be added here on purpose.
  Hosting-level headers (frame-ancestors, HSTS…) are set by the host, not here.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

<!-- Order matters: fonts/tokens → base → components → sections → layout (responsive overrides last). -->
<link rel="stylesheet" href="src/styles/fonts.css">
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/components.css">
<link rel="stylesheet" href="src/styles/header.css">
<link rel="stylesheet" href="src/styles/preview.css">
<link rel="stylesheet" href="src/styles/trips.css">
<link rel="stylesheet" href="src/styles/settings.css">
<link rel="stylesheet" href="src/styles/country-picker.css">
<link rel="stylesheet" href="src/styles/footer.css">
<link rel="stylesheet" href="src/styles/layout.css">

<script type="module" src="src/main.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="head-row">
      <h1>Travel <span>Year</span></h1>
      <div class="lang">
        <button class="lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="langMenu" data-i18n-aria="language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="menu" data-i18n-aria="language" hidden></div>
      </div>
    </div>
    <p data-i18n="tagline"></p>
  </header>

  <section class="preview" data-i18n-aria="preview">
    <canvas id="cv" width="1080" height="1920" role="img"></canvas>
    <div class="actions">
      <button class="btn primary" id="downloadBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>
        <span data-i18n="save"></span>
      </button>
      <button class="btn" id="shareBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4l4 4M6 11H5v9h14v-9h-1"/></svg>
        <span data-i18n="share"></span>
      </button>
    </div>
  </section>

  <button class="customize-btn" id="customizeBtn" type="button" aria-expanded="false" aria-controls="settings">
    <svg class="tune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    <span data-i18n="customize"></span>
    <svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg>
  </button>

  <main class="trips-col">
    <div class="group-title"><span data-i18n="trips"></span><span class="stats" id="stats"></span></div>
    <ul class="trips" id="trips"></ul>
    <div class="card empty" id="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      </div>
      <span data-i18n="emptyText"></span><br>
      <span data-i18n="emptyAdd"></span> <button class="link" type="button" id="demoBtn" data-i18n="loadDemo"></button>.
    </div>
    <button class="add-btn" id="addBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="addTrip"></span>
    </button>
    <div class="footer-links">
      <button class="link" type="button" id="clearBtn" data-i18n="clearTrips"></button>
    </div>
  </main>

  <aside class="settings" id="settings">
    <div class="group-title"><span data-i18n="general"></span></div>
    <div class="card">
      <div class="row">
        <span data-i18n="year"></span>
        <div class="stepper">
          <button type="button" id="yearPrev" data-i18n-aria="prevYear">‹</button>
          <output id="yearOut" aria-live="polite"></output>
          <button type="button" id="yearNext" data-i18n-aria="nextYear">›</button>
        </div>
      </div>
    </div>

    <div class="group-title"><span data-i18n="theme"></span></div>
    <div class="card">
      <div class="themes" role="radiogroup" data-i18n-aria="theme">
        <label class="theme-tile">
          <input type="radio" name="theme" value="dark">
          <canvas class="thumb" data-thumb="dark" width="180" height="320"></canvas>
          <span class="tname" data-i18n="themeDark"></span>
        </label>
        <label class="theme-tile">
          <input type="radio" name="theme" value="light">
          <canvas class="thumb" data-thumb="light" width="180" height="320"></canvas>
          <span class="tname" data-i18n="themeLight"></span>
        </label>
        <label class="theme-tile">
          <input type="radio" name="theme" value="custom">
          <span class="thumb-box">
            <canvas class="thumb" data-thumb="custom" width="180" height="320"></canvas>
            <span class="thumb-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></span>
          </span>
          <span class="tname" data-i18n="themeCustom"></span>
        </label>
      </div>
      <div class="custom-colors" id="customColors">
        <div class="custom-inner">
          <label class="row">
            <span data-i18n="colorBg"></span>
            <span class="color-pick"><span class="hex" data-hex="bg"></span><input type="color" data-color="bg" tabindex="-1"></span>
          </label>
          <label class="row">
            <span data-i18n="colorText"></span>
            <span class="color-pick"><span class="hex" data-hex="text"></span><input type="color" data-color="text" tabindex="-1"></span>
          </label>
          <label class="row">
            <span data-i18n="colorAccent"></span>
            <span class="color-pick"><span class="hex" data-hex="accent"></span><input type="color" data-color="accent" tabindex="-1"></span>
          </label>
        </div>
      </div>
    </div>

    <details class="card adv" id="advanced">
      <summary class="row"><span data-i18n="advanced"></span><svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg></summary>
      <label class="row">
        <span data-i18n="weekSunday"></span>
        <input type="checkbox" class="switch" id="weekSunday">
      </label>
      <div class="row">
        <span data-i18n="alignYear"></span>
        <div class="seg seg-icons" role="radiogroup" data-i18n-aria="alignYear">
          <label><input type="radio" name="yearAlign" value="left" data-i18n-aria="alignLeft"><span><svg viewBox="0 0 20 20"><path d="M3 5h14M3 9h9M3 13h14M3 17h9"/></svg></span></label>
          <label><input type="radio" name="yearAlign" value="center" data-i18n-aria="alignCenter"><span><svg viewBox="0 0 20 20"><path d="M3 5h14M5.5 9h9M3 13h14M5.5 17h9"/></svg></span></label>
          <label><input type="radio" name="yearAlign" value="right" data-i18n-aria="alignRight"><span><svg viewBox="0 0 20 20"><path d="M3 5h14M8 9h9M3 13h14M8 17h9"/></svg></span></label>
        </div>
      </div>
      <div class="row">
        <span data-i18n="alignMonths"></span>
        <div class="seg seg-icons" role="radiogroup" data-i18n-aria="alignMonths">
          <label><input type="radio" name="monthAlign" value="left" data-i18n-aria="alignLeft"><span><svg viewBox="0 0 20 20"><path d="M3 5h14M3 9h9M3 13h14M3 17h9"/></svg></span></label>
          <label><input type="radio" name="monthAlign" value="center" data-i18n-aria="alignCenter"><span><svg viewBox="0 0 20 20"><path d="M3 5h14M5.5 9h9M3 13h14M5.5 17h9"/></svg></span></label>
          <label><input type="radio" name="monthAlign" value="right" data-i18n-aria="alignRight"><span><svg viewBox="0 0 20 20"><path d="M3 5h14M8 9h9M3 13h14M8 17h9"/></svg></span></label>
        </div>
      </div>
      <div class="row" id="flagsRow">
        <span data-i18n="flags"></span>
        <div class="seg" role="radiogroup" data-i18n-aria="flags">
          <label><input type="radio" name="flagStyle" value="native"><span data-i18n="flagsNative"></span></label>
          <label><input type="radio" name="flagStyle" value="twemoji"><span>Twemoji</span></label>
        </div>
      </div>
      <div class="row">
        <span data-i18n="backup"></span>
        <div class="row-actions">
          <button class="btn small" type="button" id="exportBtn" data-i18n="exportData"></button>
          <button class="btn small" type="button" id="importBtn" data-i18n="importData"></button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </div>
    </details>
  </aside>

  <footer class="app-footer">
    <details class="privacy">
      <summary data-i18n="privacySummary"></summary>
      <p data-i18n="privacyText"></p>
    </details>
    <p>
      <span data-i18n="creditFlags"></span>
      <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener noreferrer">Twemoji</a>
      © Twitter <span data-i18n="creditContributors"></span>,
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC-BY 4.0</a>
    </p>
    <p>© 2026 Łukasz Święcicki · <span data-i18n="licenseNote"></span></p>
  </footer>
</div>

<dialog id="picker" aria-labelledby="pickerTitle">
  <div class="picker">
    <div class="picker-head">
      <button class="close-btn back-btn" type="button" id="pickerBack" data-i18n-aria="back" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
      <h2 id="pickerTitle" tabindex="-1"></h2>
      <button class="close-btn" type="button" id="pickerClose" data-i18n-aria="done"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="picker-search"><input type="search" id="pickerSearch" data-i18n-ph="search" autocomplete="off" enterkeyhint="done"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
